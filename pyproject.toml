[project]
name = "ntmf"
version = "0.1.0"
description = "Bridging Scales: From Single Neurons to Mean-Field Model"
requires-python = ">=3.12"
dependencies = [
    "brian2>=2.10",
    "numpy",
    "scipy",
    "pandas",
    "h5py",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "imageio",
    "networkx"
]

[project.optional-dependencies]
widget = [
    "anywidget>=0.9.0",
    "traitlets>=5.0",
    "sympy",
]
dev = [
    "pytest",
    "pytest-cov",
    "nbconvert",
    "nbclient",
    "ipykernel",
    "ipympl",
]

[tool.setuptools.packages.find]
include = ["ntmf*"]

[tool.setuptools.package-data]
"ntmf.phase_plane_widget.static" = ["*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests requiring full Brian2 simulations (seconds to minutes)",
]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
